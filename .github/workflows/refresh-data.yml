# Every 6 hours: re-run the pipeline, commit the JSON only if it changed, then redeploy.
name: Refresh schedule data

on:
  schedule:
    - cron: "17 */6 * * *" # a few minutes past the hour, when Actions is less busy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      public: ${{ steps.visibility.outputs.public }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Run the pipeline
        working-directory: pipeline
        run: uv run python ingest.py

      - name: Commit if the data changed
        id: commit
        run: |
          # `git status` (not `git diff`) so brand-new files count as changes too.
          if [ -z "$(git status --porcelain -- web/public/data)" ]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git commit -m "data: refresh schedule"
          git pull --rebase   # in case someone pushed while we were running
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Scheduled runs don't include repo details in their event, so ask the API.
      - name: Check repo visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "false" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger deploy.yml, so call it directly.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' && needs.refresh.outputs.public == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
