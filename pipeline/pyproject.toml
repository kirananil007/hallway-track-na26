[project]
name = "hallway-track-pipeline"
version = "0.1.0"
description = "Data pipeline for Hallway Track: schedule + side events -> JSON for the web app."
requires-python = ">=3.12"
dependencies = [
    "icalendar>=7.3.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Lets tests `import event_time` etc. straight from the pipeline/ folder.
pythonpath = ["."]
testpaths = ["tests"]
